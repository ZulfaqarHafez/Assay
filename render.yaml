# Render blueprint for the Assay API (long-lived host — use this for live OpenAI
# runs). The web app deploys separately on Vercel (see docs/deploy.md).
#
# One-click: Render dashboard → New → Blueprint → point at this repo.
# Set the secret env vars (marked sync:false) in the dashboard after import.
services:
  - type: web
    name: assay-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASSAY_ENV
        value: production
      - key: ASSAY_REQUIRE_HARDENING
        value: "1"
      # Public browser mode is deliberate for the web-facing API. Keep CORS
      # locked and rate limiting on; use tenant/API keys for private deployments.
      - key: ASSAY_PUBLIC_BROWSER_API
        value: "1"
      - key: ASSAY_DB_BACKEND
        value: supabase
      # Lock CORS to your Vercel web origin — this is the browser-facing
      # protection (with rate limiting). Do NOT set ASSAY_API_KEYS on the
      # web-facing host: the browser can't send a secret and it would 401 every
      # call. Add ASSAY_API_KEYS only on a separate programmatic/CI API host.
      - key: ASSAY_CORS_ORIGINS
        sync: false
      # Secrets — set these in the Render dashboard, never in git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
