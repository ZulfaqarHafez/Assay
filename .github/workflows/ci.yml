name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tracked files for secret patterns
        shell: pwsh
        run: ./scripts/check-secrets.ps1

  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Audit API runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r apps/api/requirements.txt

      - name: Run API tests
        run: python -m pytest apps/api/tests

  web:
    name: Web (lint + types + tests + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Set up Python 3.11 for e2e API
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API dependencies for e2e
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Lint
        run: npx eslint apps/web/src

      - name: Audit web production dependencies
        run: npm --workspace apps/web audit --omit=dev

      - name: Type-check
        run: npx --workspace apps/web tsc --noEmit

      - name: Unit tests
        run: npm --workspace apps/web run test -- --run

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010
        run: npm --workspace apps/web run build

      - name: Install Playwright Chromium
        run: npx --workspace apps/web playwright install --with-deps chromium

      - name: Start the API without a model key for e2e
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath pwsh -ArgumentList @("-NoProfile", "-File", "./scripts/start-e2e-api.ps1") -PassThru
          $proc.Id | Set-Content api.pid
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8010/health" -TimeoutSec 2
              if ($health.ok -and -not $health.openai_configured) { exit 0 }
            } catch {}
          }
          throw "E2E API did not become ready without a model key"

      - name: Playwright e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010
        run: npm --workspace apps/web run test:e2e -- --workers=1

  docker:
    name: API image (build + container smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production API image
        run: docker build -t assay-api:ci apps/api

      - name: Run the container
        run: |
          docker run -d --name assay-api -p 8000:8000 \
            -e ASSAY_DB_BACKEND=sqlite \
            -e ASSAY_DB_PATH=/tmp/assay-ci.db \
            -e ASSAY_DISABLE_OPENAI=1 \
            -e ASSAY_RATE_LIMIT_ENABLED=0 \
            assay-api:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl --max-time 5 -fsS http://127.0.0.1:8000/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "container never became healthy"; docker logs assay-api; exit 1

      - name: Smoke the full pipeline in the container
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health | grep -q '"ok":true'
          # The status badge is public and returns valid SVG even for unknown runs.
          curl -fsS http://127.0.0.1:8000/runs/run_ci/badge.svg | grep -q '<svg'
          # No model key in the container: intake still lints, and the exam
          # refuses with 409 and the shared message instead of faking a run.
          INTAKE=$(curl -fsS -X POST http://127.0.0.1:8000/candidates/from-markdown \
            -H 'Content-Type: application/json' \
            -d '{"markdown":"# CI Agent\n\n## Tools\n- `exec_shell(command)` run anything\n"}')
          echo "$INTAKE" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['exam_available'] is False;assert 'OPENAI_API_KEY' in d['exam_unavailable_reason'];assert 'exec_shell' in d['static_lint']['dangerous_tools'];print('lint-only intake ok')"
          CID=$(echo "$INTAKE" | python3 -c "import sys,json;print(json.load(sys.stdin)['candidate']['id'])")
          RID=$(curl -fsS -X POST http://127.0.0.1:8000/runs \
            -H 'Content-Type: application/json' \
            -d "{\"candidate_id\":\"$CID\"}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          STATUS=$(curl -sS -o /tmp/start.json -w '%{http_code}' -X POST "http://127.0.0.1:8000/runs/$RID/start")
          test "$STATUS" = "409"
          python3 -c "import json;d=json.load(open('/tmp/start.json'));assert 'OPENAI_API_KEY' in d['detail'];print('exam refused without a model:', d['detail'][:60])"
          curl -fsS "http://127.0.0.1:8000/runs/$RID" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['status']=='failed';print('refused run recorded as failed')"

      - name: Container logs on failure
        if: failure()
        run: docker logs assay-api || true

      - name: Teardown
        if: always()
        run: docker rm -f assay-api || true

  live:
    # The exam against a real model, nothing scripted. Runs when the repository
    # has an OPENAI_API_KEY secret (forks and keyless repos skip it cleanly).
    name: Live exam (real model)
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: env.OPENAI_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API dependencies
        if: env.OPENAI_API_KEY != ''
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run the live tests
        if: env.OPENAI_API_KEY != ''
        env:
          ASSAY_LIVE_K: "1"
        run: python -m pytest apps/api/tests -m live -v

      - name: No key configured
        if: env.OPENAI_API_KEY == ''
        run: echo "OPENAI_API_KEY secret is not set; live exam tests skipped."
